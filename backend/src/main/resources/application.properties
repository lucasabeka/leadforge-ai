spring.application.name=leadforge-api
server.port=${PORT:8080}

# ── Database (PostgreSQL) ──────────────────────────────────
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:leadforge_db}
spring.datasource.username=${DB_USER:user}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# ── Flyway ────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# ── JWT ───────────────────────────────────────────────────
jwt.secret=${JWT_SECRET}

# ── CORS ──────────────────────────────────────────────────
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# ── Anthropic API ─────────────────────────────────────────
anthropic.api.key=${ANTHROPIC_API_KEY}

# ── Stripe ────────────────────────────────────────────────
stripe.api.key=${STRIPE_SECRET_KEY}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:}
frontend.url=${FRONTEND_URL:http://localhost:4200}

# ── Google OAuth ──────────────────────────────────────────
google.oauth.client-id=${GOOGLE_CLIENT_ID}
google.oauth.client-secret=${GOOGLE_CLIENT_SECRET}
google.oauth.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8080/api/auth/google/callback}
